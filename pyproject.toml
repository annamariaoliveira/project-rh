[project]
name = "src"
version = "0.1.0"
description = "Template de projetos de ciência de dados"
authors = [{ name = "Aislan Freitas", email = "aislansf@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "matplotlib>=3.9.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.5.1",
    "jupyterlab>=4.3.0",
    "ipywidgets>=8.1.3",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "invoke>=2.2.0",
]
docs = [
    # O MkDocs 2.0 remove o sistema de plugins e quebra os plugins abaixo.
    "mkdocs>=1.6.1,<2.0",
    "mkdocs-material>=9.5.44",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mkdocs-print-site-plugin>=2.5.0",
    "pymdown-extensions>=10.8.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
