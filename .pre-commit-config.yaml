# Instale os hooks com: uv run pre-commit install
# Atualize as versões com: uv run pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe valida apenas a sintaxe: o mkdocs.yml usa tags do tipo
        # !!python/name: que o carregador seguro do PyYAML não resolve.
        args: ["--unsafe"]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Remove os outputs dos notebooks antes do commit
  # (evita diffs gigantes e vazamento de dados sensíveis)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
